[project]
name = "playlist-briefing"
version = "0.1.0"
description = "Private deutsche YouTube-Playlist-Berichte mit bestätigter Archivierung"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "jinja2>=3.1,<4", "python-multipart>=0.0.20,<1", "cryptography>=44", "python-dotenv>=1,<2", "youtube-transcript-api>=1.2,<2", "markdown-it-py>=3,<5", "bleach>=6,<7", "urllib3>=2.3,<3"]
[dependency-groups]
dev = ["pytest>=8,<10"]
[tool.pytest.ini_options]
pythonpath = ["."]
